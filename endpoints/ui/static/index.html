<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabbyAPI Chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cpath%20d='M5.2%2014%204.6%203.6%2012.2%208.6Q16%207.4%2019.8%208.6L27.4%203.6%2026.8%2014Q28.6%2017.2%2028%2021Q26.6%2028.8%2016%2029Q5.4%2028.8%204%2021Q3.4%2017.2%205.2%2014Z'%20fill='none'%20stroke='%23c2410c'%20stroke-width='2.8'%20stroke-linejoin='round'/%3E%3Ctext%20x='16'%20y='25.4'%20font-family='sans-serif'%20font-size='15.5'%20font-weight='800'%20fill='%23c2410c'%20text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body>
  <div id="app">
    <!-- Sessions -->
    <aside id="sidebar" class="drawer drawer-left">
      <button id="new-chat" class="new-chat" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
      <nav id="session-list" aria-label="Chat sessions"></nav>
      <div class="sidebar-footer">
        <button id="open-connection" class="sidebar-item" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7h3a5 5 0 0 1 0 10h-3M9 17H6A5 5 0 0 1 6 7h3M8 12h8"/></svg>
          <span>Connection</span>
          <span id="connection-state" class="pill"></span>
        </button>
        <button id="toggle-markdown" class="sidebar-item" type="button" title="Show replies formatted as Markdown, or as the exact text the model wrote">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg>
          <span id="markdown-label">Replies</span>
        </button>
        <a class="sidebar-item" href="status.html" target="tabby-status">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
          <span>Server status</span>
        </a>
        <label class="sidebar-item theme-picker">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18c1.1 0 1.7-.8 1.7-1.7 0-.4-.2-.8-.4-1.1a1.7 1.7 0 0 1 1.3-2.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/><circle cx="17" cy="11" r="1"/></svg>
          <span>Theme</span>
          <select id="theme-select"></select>
        </label>
      </div>
    </aside>

    <!-- Conversation -->
    <main id="main">
      <header id="topbar">
        <button class="icon-button panel-toggle" data-drawer="sidebar" type="button" aria-controls="sidebar" aria-label="Chats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <div id="topbar-model" class="topbar-model">
          <span id="model-dot" class="dot"></span>
          <span id="topbar-model-name">No model</span>
        </div>
        <button class="icon-button panel-toggle" data-drawer="panel" type="button" aria-controls="panel" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
        </button>
      </header>

      <div id="thread" aria-live="polite">
        <div id="system-row" class="row row-system">
          <div class="row-inner">
            <details id="system-details">
              <summary>System prompt <span id="system-preview" class="muted"></span></summary>
              <textarea id="system-prompt" rows="3" placeholder="Optional system message for this chat"></textarea>
            </details>
          </div>
        </div>
        <div id="messages"></div>
        <div id="empty-state" class="empty-state">
          <h1>TabbyAPI</h1>
          <p>Load a model on the <a href="status.html" target="tabby-status">status page</a>, then start typing.</p>
        </div>
      </div>

      <div id="drop-overlay" class="drop-overlay" hidden><span>Drop images to attach them</span></div>

      <footer id="composer-area">
        <div class="composer-actions">
          <button id="regenerate" class="ghost-button" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
            Regenerate response
          </button>
          <button id="stop" class="ghost-button" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
            Stop generating
          </button>
        </div>
        <form id="composer" class="composer">
          <div id="attachments" class="attachments" hidden></div>
          <button id="attach" type="button" class="attach-button" aria-label="Attach images" title="Attach images (or paste, or drop them anywhere)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7l8.5-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.3-2.3l7.9-8"/></svg>
          </button>
          <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" multiple hidden>
          <textarea id="input" rows="1" placeholder="Send a message" autocomplete="off"></textarea>
          <button id="send" type="submit" class="send-button" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>
          </button>
        </form>
        <p id="status-line" class="status-line"></p>
      </footer>
    </main>

    <!-- Model and sampling -->
    <aside id="panel" class="drawer drawer-right">
      <section class="panel-section">
        <div class="section-head">
          <h2>Model</h2>
          <button id="refresh-models" class="icon-button small" type="button" aria-label="Refresh" title="Refresh">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          </button>
        </div>
        <div id="model-info" class="model-info"></div>
        <a id="status-link" class="status-link" href="status.html" target="tabby-status">View server status</a>
      </section>

      <section class="panel-section">
        <div class="section-head">
          <h2>Sampling</h2>
          <button id="reset-params" class="link-button" type="button">Reset all</button>
        </div>
        <label class="field">
          <span>Server preset</span>
          <select id="preset-select"></select>
        </label>
        <p id="preset-info" class="hint"></p>
        <div id="params"></div>
      </section>
    </aside>

    <div id="scrim" hidden></div>
  </div>

  <dialog id="connection-dialog">
    <form id="connection-form">
      <h2>Connection</h2>
      <label class="field">
        <span>Server URL</span>
        <input id="conn-url" type="url" placeholder="This server">
      </label>
      <label class="field">
        <span>API key</span>
        <input id="conn-key" type="password" autocomplete="off" placeholder="From api_tokens.yml">
      </label>
      <p class="hint">An admin key is needed to list and load models. The key is kept in this browser's local storage.</p>
      <p id="conn-result" class="hint"></p>
      <div class="button-row end">
        <button id="conn-cancel" type="button">Cancel</button>
        <button id="conn-save" class="primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="image-viewer" class="image-viewer" aria-label="Image">
    <img alt="Attached image">
  </dialog>

  <script src="vendor/markdown-it.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
